[package]
name = "porw-attestation"
description = "PoRW attestation evidence verification: vendor-root -> device-identity -> report signature chain binding device id, node key and code measurement"
license = "0BSD"
version = "0.1.0"
authors = ["Jianming Liu <liujm06@gmail.com>"]
edition.workspace = true
include = ["/src", "/Cargo.toml"]

[lib]
bench = false

[dependencies]
parity-scale-codec = { workspace = true, default-features = false, features = ["derive"] }
scale-info = { workspace = true, default-features = false, features = ["derive"] }
sp-io = { workspace = true, default-features = false }
sp-core = { workspace = true, default-features = false }

[dev-dependencies]
sp-core = { workspace = true, features = ["std", "full_crypto"] }

[features]
default = ["std"]
std = [
    "parity-scale-codec/std",
    "scale-info/std",
    "sp-io/std",
    "sp-core/std",
]
