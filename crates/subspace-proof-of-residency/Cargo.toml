[package]
name = "subspace-proof-of-residency"
description = "Proof-of-Resident-Weights (PoRW) consensus primitives: residency sketch, tile Merkle commitments, ticket expansion and fraud-proof verification"
license = "0BSD"
version = "0.1.0"
authors = ["Jianming Liu <liujm06@gmail.com>"]
edition.workspace = true
include = [
    "/src",
    "/Cargo.toml",
]

[lib]
bench = false

[dependencies]
blake3.workspace = true
parity-scale-codec = { workspace = true, features = ["derive"] }
scale-info = { workspace = true, features = ["derive"] }

[features]
default = ["std"]
std = [
    "blake3/std",
    "parity-scale-codec/std",
    "scale-info/std",
]
